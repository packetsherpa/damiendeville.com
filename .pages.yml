    filename:
      template: "{slug}.md"
      field: create
    exclude: ["_index.md"]
    subfolders: false
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      search: [title, description, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: text
        required: true
        description: One sentence for lists, feeds, and social previews.
      - name: categories
        label: Categories
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Header image
        type: image
        options:
          media: technology_images
          rename: safe
      - name: image_alt
        label: Image description
        type: string
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          media: technology_images
          rename: safe

  - name: listening_notes
    label: Listening Notes
    type: collection
    path: content/music/listening
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create
    subfolders: false
    view:
