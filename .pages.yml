      sort: [date, title]
      search: [title, artist, release, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: text
        required: true
      - name: music_kind
        type: string
        default: Listening note
        hidden: true
      - name: artist
        type: string
        required: true
      - name: release
        label: Album or release
        type: string
      - name: release_year
        label: Release year
        type: string
      - name: playlist_url
        label: Playlist or album URL
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Header image
        type: image
        options:
          media: music_images
          rename: safe
      - name: image_alt
        label: Image description
        type: string
      - name: body
        label: Note
        type: rich-text
        options:
          format: markdown
          media: music_images
          rename: safe

  - name: live_shows
