baseURL = "https://damiendeville.com/"
locale = "en-US"
title = "Damien DeVille"
timeZone = "America/New_York"
enableRobotsTXT = true
summaryLength = 36
theme = "PaperMod"

[params]
  env = "production"
  author = "Damien DeVille"
  tagline = "Notes on Technology, Life, & Music"
  description = "Independent writing by Damien DeVille on security, artificial intelligence, technical leadership, listening, and live music."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  mainSections = ["technology", "music"]

  [params.cover]
    linkFullImages = true
    responsiveImages = false

[permalinks]
  technology = "/technology/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 30

[markup.highlight]
  codeFences = true
  guessSyntax = true
  noClasses = false

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[[menus.main]]
  name = "Technology"
  pageRef = "/technology"
  weight = 10

[[menus.main]]
  name = "Music"
  pageRef = "/music"
  weight = 20

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30
