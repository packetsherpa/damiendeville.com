baseURL = "https://packetsherpa.org/"
locale = "en-US"
title = "PacketSherpa"
timeZone = "America/New_York"
enableRobotsTXT = true
summaryLength = 36
theme = "PaperMod"

[params]
  env = "production"
  author = "Damien DeVille"
  description = "Damien DeVille on security, artificial intelligence, complex systems, and technical leadership."
  defaultTheme = "auto"
  # Both packetsherpa.org and the damiendeville.com mirror build from this
  # config, so this one value decides which domain search engines treat as the
  # original. packetsherpa.org is being blocked by some DNS filters for being a
  # newly registered domain, so damiendeville.com is canonical for now. To flip
  # back once packetsherpa.org ages out (target: mid-September 2026), set this
  # to "https://packetsherpa.org/" — nothing else needs to change.
  canonicalBaseURL = "https://damiendeville.com/"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  mainSections = ["technology"]
  images = ["images/og-default.jpg"]

  [params.cover]
    linkFullImages = true
    responsiveImages = true

  [params.homeInfoParams]
    Title = ""
    Content = "Notes on security, artificial intelligence, complex systems, and technical leadership. I've spent 25+ years in networking and cybersecurity — hands-on engineering, systems architecture, and technical leadership — and I write here about how these systems fail and what actually holds them together."

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/ddeville/"
  [[params.socialIcons]]
    name = "threads"
    title = "Threads"
    url = "https://www.threads.com/@packetsherpa"
  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url = "index.xml"

[permalinks]
  technology = "/:contentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 30

[markup.highlight]
  codeFences = true
  guessSyntax = true
  noClasses = false

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[[menus.main]]
  name = "Archive"
  pageRef = "/technology"
  weight = 10

[[menus.main]]
  name = "Music"
  url = "https://steady.org/"
  weight = 20

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30
